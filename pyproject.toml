[project]
name = "machina-cad-deid"
version = "0.1.0"
description = "Reproducible de-identification pipeline for engineering/CAD corpora"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "olefile==0.47",
  "pikepdf==9.4.2",
  "pymupdf==1.24.14",
  "pyahocorasick==2.1.0",
  "pillow==11.0.0",
  "tqdm==4.67.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.8.4"]

[project.scripts]
deid = "deid.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["deid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
